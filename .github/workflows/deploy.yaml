---
name: Terraform + Deployment

on:
  push:
    branches: [dev]
    paths:
      - "terraform/**"
      - ".github/workflows/deploy.yaml"
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - "docker-compose.yaml"
  pull_request:
    branches: [dev]
    paths:
      - "terraform/**"
      - ".github/workflows/**"
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yaml"
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    outputs:
      ec2_public_dns: ${{ steps.save-outputs.outputs.ec2_public_dns }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init & Apply
        run: |
          terraform -chdir=./terraform init
          terraform -chdir=./terraform validate
          terraform -chdir=./terraform plan -out=tfplan
          terraform -chdir=./terraform apply -auto-approve tfplan

      - name: Save Terraform outputs
        id: save-outputs
        run: |
          echo "EC2_PUBLIC_IP=$(terraform -chdir=./terraform output -raw ec2_public_ip)" >> "$GITHUB_ENV"
          echo "EC2_INSTANCE_ID=$(terraform -chdir=./terraform output -raw ec2_instance_id)" >> "$GITHUB_ENV"
          echo "VPC_ID=$(terraform -chdir=./terraform output -raw vpc_id)" >> "$GITHUB_ENV"
          echo "SUBNET_ID=$(terraform -chdir=./terraform output -raw subnet_id)" >> "$GITHUB_ENV"
          echo "ec2_public_dns=$(terraform -chdir=./terraform output -raw ec2_public_dns)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy project files to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ needs.terraform.outputs.ec2_public_dns }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/*,frontend/*,docker-compose.yaml, scripts/*"
          target: "/home/${{ secrets.EC2_USER }}/dream-app"

      - name: Create .env on EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ needs.terraform.outputs.ec2_public_dns }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cat <<EOF > /home/${{ secrets.EC2_USER }}/dream-app/.env
            DB_USER=${{ secrets.DATABASE_USER }}
            DB_PASS=${{ secrets.DATABASE_PASSWD }}
            EOF

      - name: SSH to EC2 and deploy Docker
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ needs.terraform.outputs.ec2_public_dns }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/dream-app
            docker compose pull
            docker compose up -d --build

            cd /home/${{ secrets.EC2_USER }}/dream-app/scripts
            chmod u+x certbot-config.sh
            ./certbot-config.sh
      - name: SSH to EC2 and configure certbot
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ needs.terraform.outputs.ec2_public_dns }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/dream-app/scripts
            chmod u+x certbot-config.sh
            

